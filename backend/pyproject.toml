[project]
name = "drydocs-backend"
version = "1.0.0"
description = "Document Manager API - Phase 1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.25",
  "asyncpg>=0.29.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.1.0",
  "python-multipart>=0.0.6",
  "minio>=7.2.0",
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.26.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.1.0",
  "ty>=0.0.34",
  "fpdf2>=2.7.0",
  "alembic>=1.13.0",
  "slowapi>=0.1.8",
  "types-python-jose>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ty]
python_version = "3.11"
